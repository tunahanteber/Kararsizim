{% load static %}<!doctype html>
<html lang="tr">
<script>document.documentElement.classList.add("js")</script>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}kararsızım{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
  <header class="topbar">
    <a class="wordmark" href="/" aria-label="kararsızım">kararsız<span class="wordmark-i">ı</span>m</a>
    <nav class="topnav">
      {% if user.is_authenticated %}
        <span class="topnav-user">@{{ user.username }}</span>
        <form method="post" action="/cikis/" class="inline-form">{% csrf_token %}<button type="submit" class="link-btn">Çıkış</button></form>
      {% else %}
        <a href="/giris/">Giriş</a>
      {% endif %}
      <a class="btn btn-brand" href="/yeni/">Anket aç</a>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  {% if messages %}
    <div class="toasts" aria-live="polite">
      {% for message in messages %}<div class="toast toast-{{ message.tags }}">{{ message }}</div>{% endfor %}
    </div>
  {% endif %}
  <script src="{% static 'js/app.js' %}" defer></script>
</body>
</html>
