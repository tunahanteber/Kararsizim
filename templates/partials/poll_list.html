{% for poll in page.object_list %}
  {% include "partials/poll_card.html" %}
{% empty %}
  <div class="card empty">{{ empty_text }}</div>
{% endfor %}
{% if page.has_other_pages %}
  <nav class="pager" aria-label="Sayfalar">
    {% if page.has_previous %}<a class="btn btn-ghost" href="?{{ base_qs }}sayfa={{ page.previous_page_number }}">← Yeniler</a>{% endif %}
    {% if page.has_next %}<a class="btn btn-ghost" href="?{{ base_qs }}sayfa={{ page.next_page_number }}">Daha fazla →</a>{% endif %}
  </nav>
{% endif %}
