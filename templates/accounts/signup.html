{% extends "base.html" %}
{% block title %}Kayıt ol · kararsızım{% endblock %}
{% block content %}
  <section class="card">
    <h1>Aramıza katıl</h1>
    <p class="muted">Anket açmak için üye ol. Oy vermek için üyelik gerekmez.</p>
    <form method="post" class="form" novalidate>
      {% csrf_token %}
      {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
      {% include "accounts/_form.html" %}
      <button type="submit" class="btn btn-brand btn-block">Kayıt ol</button>
    </form>
    <p class="muted">Zaten üye misin? <a href="/giris/{% if next %}?next={{ next|urlencode }}{% endif %}">Giriş yap</a></p>
  </section>
{% endblock %}
