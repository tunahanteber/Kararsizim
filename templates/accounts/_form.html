{% if form.non_field_errors %}
  <div class="form-errors" role="alert">{{ form.non_field_errors }}</div>
{% endif %}
{% for field in form %}
  <div class="field">
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% if field.help_text %}<p class="field-hint" {% if field.name == "username" %}data-hint-for="username"{% endif %}>{{ field.help_text }}</p>{% endif %}
    {% for error in field.errors %}<p class="field-error">{{ error }}</p>{% endfor %}
  </div>
{% endfor %}
